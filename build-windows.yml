name: VILO - instalator Windows
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'
      - 'backend/**'
      - 'main.js'
      - 'package.json'
      - 'vilo.ico'
      - 'tests/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zainstaluj zaleznosci backendu
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller httpx
      - name: Testy serwerow, kanalow i profili
        run: python -m unittest discover -s tests -v
      - name: Zbuduj samodzielny backend Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name vilo-server --distpath backend-dist --collect-all uvicorn --collect-all fastapi --collect-all python_multipart --collect-all websockets --collect-all PIL --add-data "backend/static;static" --paths backend backend/backend_entry.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - name: Sprawdz uruchomienie spakowanego backendu i pliki UI
        run: python scripts/smoke_packaged_backend.py
      - name: Sprawdz skladnie plikow Electron i JavaScript
        run: |
          node --check main.js
          node --check backend/static/app.js
      - name: Zainstaluj zaleznosci desktop
        run: npm install --no-audit --no-fund
      - name: Zbuduj VILO-Setup.exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sprawdz czy instalator powstal
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter "VILO-Setup-*.exe" | Select-Object -First 1
          if (!$setup -or $setup.Length -lt 10000000) { throw "Brak poprawnego instalatora" }
          Write-Output "Powstal instalator: $($setup.Name) ($($setup.Length) bajtow)"
      - name: Udostepnij instalator do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: VILO-Windows-Instalator
          path: release/VILO-Setup-*.exe
          if-no-files-found: error
