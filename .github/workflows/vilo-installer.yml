
name: VILO - Instalator Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Przygotuj pliki VILO
        shell: pwsh
        run: |
          if (!(Test-Path 'backend/server.py')) {
            New-Item -ItemType Directory -Force 'backend/static' | Out-Null

            foreach ($f in @('server.py', 'backend_entry.py', 'requirements.txt')) {
              if (!(Test-Path $f)) { throw "Brakuje pliku: $f" }
              Copy-Item $f "backend/$f"
            }

            foreach ($f in @('index.html', 'style.css', 'app.js', 'favicon.png', 'vilo-icon.png')) {
              if (!(Test-Path $f)) { throw "Brakuje pliku: $f" }
              Copy-Item $f "backend/static/$f"
            }
          }

          foreach ($f in @('backend/backend_entry.py', 'backend/requirements.txt', 'backend/static/index.html', 'main.js', 'package.json', 'vilo.ico')) {
            if (!(Test-Path $f)) { throw "Brakuje pliku: $f" }
          }

      - name: Instalacja bibliotek
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Budowanie backendu Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name vilo-server --distpath backend-dist --collect-all uvicorn --collect-all fastapi --add-data "backend/static;static" --paths backend backend/backend_entry.py

          if ($LASTEXITCODE -ne 0) { throw 'Blad budowania backendu' }

          if (!(Test-Path 'backend-dist/vilo-server/vilo-server.exe')) {
            throw 'Brak vilo-server.exe'
          }

      - name: Budowanie instalatora VILO
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Blad npm install' }

          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw 'Blad instalatora' }

      - name: Gotowy instalator
        uses: actions/upload-artifact@v4
        with:
          name: VILO-Windows-Instalator
          path: release/VILO-Setup-*.exe
          if-no-files-found: error
